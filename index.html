<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anatomia 3D</title>
  <meta name="description" content="Quizuri de anatomie pe un corp 3D: oase, mușchi și sistemul nervos. Găsește structurile, numește-le sau explorează modelul.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Anatomia 3D">
  <meta property="og:description" content="Quizuri de anatomie pe un corp 3D: oase, mușchi și sistemul nervos.">
  <meta property="og:image" content="assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    try {
      const theme = JSON.parse(localStorage.getItem('theme'));
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#app" data-skip-link>Sari la conținut</a>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Anatomia 3D</a>
    <nav class="systems" aria-label="Quizuri"></nav>
    <div class="search">
      <input type="search" autocomplete="off" spellcheck="false">
      <div class="search-results" role="listbox" hidden></div>
    </div>
    <div class="lang" role="group" aria-label="Limba / Language">
      <button data-lang="ro">RO</button><button data-lang="en">EN</button>
    </div>
    <button class="theme-toggle" data-theme-toggle></button>
    <button class="burger" aria-expanded="false" aria-controls="drawer" aria-label="Meniu"><span></span><span></span><span></span></button>
  </header>
  <div class="drawer" id="drawer" hidden></div>
  <main id="app" tabindex="-1"></main>
  <div class="toasts" aria-live="polite"></div>
</body>
</html>
